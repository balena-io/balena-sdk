name: Flowzone

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  id-token: write  # https://docs.npmjs.com/trusted-publishers
  contents: read
  packages: read

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master # flowzonify 0.4.23
    secrets: inherit
    with:
      custom_test_matrix: >
        {
          "os": [["windows-latest"],["ubuntu-latest"],["macos-latest"]]
        }
